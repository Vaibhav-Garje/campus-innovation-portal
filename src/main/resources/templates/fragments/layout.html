<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Campus Innovation Portal</title>
    <!-- Tailwind CSS Script for CDN Development -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        hyper: {
                            cyan: 'var(--accent-cyan)',
                            pink: 'var(--accent-pink)',
                            violet: 'var(--accent-violet)',
                            deep: 'var(--bg-deep)',
                            text: 'var(--text-main)',
                            title: 'var(--text-title)',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <!-- Particles JS -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <!-- Custom Styles -->
    <link href="/css/global.css" rel="stylesheet" />
    
    <!-- Theme Initialization -->
    <script>
        if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            window.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('light-mode');
            });
        }
    </script>
</head>

<body class="bg-hyper-deep text-slate-50 min-h-screen">
    
    <!-- Hyper-Space Background -->
    <div th:fragment="background">
        <div class="mesh-bg">
            <div class="mesh-blob top-0 left-0"></div>
            <div class="mesh-blob bottom-0 right-0" style="animation-delay: -5s; background: radial-gradient(circle, rgba(0, 242, 255, 0.1), transparent 70%);"></div>
        </div>
        <div id="particles-bg" class="fixed inset-0 z-[-1] pointer-events-none"></div>
    </div>

    <!-- Navigation Bar -->
    <nav th:fragment="navbar" class="w-full glass sticky top-0 z-50 px-8 py-4 flex justify-between items-center bg-black/20">
        <a th:href="@{/}" class="text-2xl font-black tracking-tight flex items-center gap-3">
            <span class="text-3xl animate-bounce">🛡️</span>
            <span class="animate-gradient font-black text-3xl">InnovateCampus</span>
        </a>
        <div class="flex items-center gap-6">
            <div sec:authorize="isAuthenticated()" class="flex items-center gap-8">
                <a th:href="@{/dashboard}" class="text-sm font-semibold text-hyper-text hover:text-hyper-cyan transition-all uppercase tracking-widest">Dashboard</a>
                <a th:href="@{/projects/list}" class="text-sm font-semibold text-hyper-text hover:text-hyper-cyan transition-all uppercase tracking-widest">Innovation Gallery</a>
                <a th:href="@{/team/my-teams}" class="text-sm font-semibold text-hyper-text hover:text-hyper-cyan transition-all uppercase tracking-widest">My Syncs</a>
                
                <!-- Role Specific Links -->
                <div sec:authorize="hasAnyRole('FACULTY', 'ADMIN')">
                    <a th:href="@{/faculty/dashboard}" class="text-sm font-semibold text-hyper-pink hover:brightness-125 transition-all uppercase tracking-widest">Faculty HUD</a>
                </div>

                <a th:href="@{/projects/submit}" class="px-6 py-2 rounded-xl bg-gradient-to-r from-hyper-violet to-hyper-pink text-white text-sm font-bold shadow-[0_0_20px_rgba(112,0,255,0.4)] hover:shadow-[0_0_30px_rgba(255,0,242,0.6)] hover:scale-105 transition-all">Pitch Idea</a>
                
                <form th:action="@{/auth/logout}" method="post" class="m-0">
                    <button type="submit" class="text-sm font-bold text-red-500 hover:text-red-400 border-b border-transparent hover:border-red-500/50 transition-all uppercase">Terminate</button>
                </form>
            </div>
            <div sec:authorize="!isAuthenticated()" class="flex gap-6">
                <a th:href="@{/auth/login}" class="text-sm font-bold text-hyper-text hover:text-hyper-cyan transition-all uppercase tracking-widest py-2">Sign In</a>
                <a th:href="@{/auth/register}" class="px-6 py-2 rounded-xl border border-hyper-cyan/50 text-hyper-cyan text-sm font-bold shadow-[0_0_15px_rgba(0,242,255,0.2)] hover:bg-hyper-cyan/10 hover:shadow-[0_0_25px_rgba(0,242,255,0.4)] transition-all">Initialize Access</a>
            </div>
            
            <!-- Theme Toggle -->
            <button id="themeToggle" class="w-10 h-10 rounded-full glass hover:bg-white/10 flex items-center justify-center text-xl transition-all border border-white/10 hover:border-hyper-cyan">
                🌓
            </button>
        </div>
    </nav>
    
    <!-- Global Scripts Fragment -->
    <div th:fragment="scripts">
        <!-- Particles Scene Init -->
        <script src="/js/particles-scene.js"></script>
        
        <!-- Theme Toggle Logic -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const themeToggle = document.getElementById('themeToggle');
                if (themeToggle) {
                    themeToggle.addEventListener('click', () => {
                        const isLightMode = document.body.classList.toggle('light-mode');
                        localStorage.setItem('theme', isLightMode ? 'light' : 'dark');
                    });
                }
            });
        </script>
    </div>
</body>
</html>
