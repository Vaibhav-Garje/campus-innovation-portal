<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold">🎓 Campus Innovation Portal</a>
    <div>
        <a th:href="@{/projects/submit}" class="btn btn-success btn-sm me-2">Submit Project</a>
        <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <a th:href="@{/auth/logout}" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- Success / Error Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${info}" class="alert alert-info alert-dismissible">
        <span th:text="${info}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h2 class="mb-4">All Projects</h2>
    <div class="row">
        <div class="col-md-6 mb-4" th:each="project : ${projects}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${project.title}"></h5>
                    <p class="card-text" th:text="${project.description}"></p>
                    <div class="mb-3">
                        <span class="badge bg-primary me-1" th:text="${project.domain}"></span>
                        <span class="badge bg-warning text-dark me-1" th:text="${project.status}"></span>
                        <span class="badge bg-success">👍 <span th:text="${project.voteCount}"></span> Votes</span>
                    </div>
                </div>
                <div class="card-footer d-flex gap-2 flex-wrap">

                    <!-- Vote -->
                    <form th:action="@{/vote/{projectId}(projectId=${project.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-outline-primary btn-sm">👍 Vote</button>
                    </form>

                    <!-- Join Team -->
                    <form th:action="@{/team/join/{projectId}(projectId=${project.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-outline-success btn-sm">🤝 Join Team</button>
                    </form>

                    <!-- Milestones -->
                    <a th:href="@{/milestone/{projectId}(projectId=${project.id})}"
                       class="btn btn-outline-info btn-sm">📋 Milestones</a>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
