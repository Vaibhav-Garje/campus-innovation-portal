<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registry Approval - InnovateCampus')}"></head>
<body class="bg-hyper-deep text-slate-50 min-h-screen relative flex flex-col">
    
    <!-- Hyper-Space Background -->
    <div th:replace="~{fragments/layout :: background}"></div>

    <!-- Navbar -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="max-w-7xl mx-auto px-6 py-12 relative z-10 w-full animate-[fade-in_1s_ease-out]">
        
        <!-- Flash Messages -->
        <div th:if="${success}" class="glass border-hyper-cyan/50 bg-hyper-cyan/10 text-hyper-cyan p-6 rounded-3xl mb-12 flex justify-between items-center shadow-[0_0_30px_rgba(0,242,255,0.2)] animate-pulse">
            <span class="font-black uppercase tracking-widest" th:text="${success}"></span>
            <button onclick="this.parentElement.style.display='none'" class="text-hyper-cyan hover:scale-125 transition-transform">&times;</button>
        </div>
        <div th:if="${error}" class="glass border-red-500/50 bg-red-500/10 text-red-500 p-6 rounded-3xl mb-12 flex justify-between items-center shadow-[0_0_30px_rgba(239,68,68,0.2)]">
            <span class="font-black uppercase tracking-widest" th:text="${error}"></span>
            <button onclick="this.parentElement.style.display='none'" class="text-red-500 hover:scale-125 transition-transform">&times;</button>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mb-16 gap-8 border-b border-white/5 pb-10">
            <div>
                <h1 class="text-6xl md:text-7xl font-black text-white leading-none uppercase italic tracking-tighter">
                    Protocol <br/>
                    <span class="animate-gradient">Registry.</span>
                </h1>
                <p class="text-slate-500 mt-4 text-sm font-bold uppercase tracking-[0.4em]">Comprehensive Oversight Terminal</p>
            </div>
            <a th:href="@{/faculty/dashboard}" class="px-8 py-4 rounded-xl glass hover:bg-white/10 text-white font-black uppercase text-xs tracking-widest border border-white/10 hover:border-hyper-pink/50 transition-all">
                &lsaquo; Back to HUD
            </a>
        </div>

        <!-- Project Grid for Faculty -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <div th:each="project : ${projects}" class="glass rounded-[2.5rem] p-8 flex flex-col h-full group relative overflow-hidden transition-all duration-700 hover:border-white/20 border-white/5">
                
                <!-- Status Badge -->
                <div class="absolute top-6 right-6 px-4 py-1.5 text-[10px] font-black rounded-lg uppercase tracking-[0.2em] border shadow-2xl z-20"
                     th:classappend="${project.status == 'APPROVED' ? 'bg-hyper-cyan/10 text-hyper-cyan border-hyper-cyan/40 shadow-[0_0_15px_rgba(0,242,255,0.2)]' : (project.status == 'REJECTED' ? 'bg-red-500/10 text-red-400 border-red-500/40' : 'bg-hyper-pink/10 text-hyper-pink border-hyper-pink/40 shadow-[0_0_15px_rgba(255,0,242,0.2)]')}"
                     th:text="${project.status}">
                </div>

                <div class="mb-8 pt-4 relative z-10">
                    <span class="inline-block px-4 py-1.5 rounded-lg bg-white/5 text-slate-500 text-[9px] font-black uppercase tracking-[0.3em] mb-6 border border-white/10" th:text="${project.domain}"></span>
                    <h3 class="text-3xl font-black text-white mb-4 uppercase tracking-tighter transition-all" th:text="${project.title}"></h3>
                    <p class="text-slate-400 line-clamp-3 text-sm leading-relaxed font-light" th:text="${project.description}"></p>
                </div>
                
                <div class="flex-grow"></div>

                <div class="mt-8 pt-8 border-t border-white/5 relative z-10 flex flex-col gap-6">
                    <div class="flex items-center justify-between text-[10px] font-black uppercase tracking-widest text-slate-500">
                        <div>Neural Vote Index</div>
                        <div class="text-white text-lg" th:text="${project.voteCount}">0</div>
                    </div>

                    <div class="flex gap-4" th:if="${project.status == 'PENDING'}">
                        <form th:action="@{/faculty/approve/{id}(id=${project.id})}" method="post" class="flex-1">
                            <button type="submit" class="w-full py-4 rounded-xl bg-hyper-cyan/10 text-hyper-cyan border border-hyper-cyan/20 font-black uppercase text-[10px] tracking-widest hover:bg-hyper-cyan hover:text-white transition-all duration-500 shadow-[0_0_15px_rgba(0,242,255,0.1)]">
                                Approve
                            </button>
                        </form>
                        <form th:action="@{/faculty/reject/{id}(id=${project.id})}" method="post" class="flex-1">
                            <button type="submit" class="w-full py-4 rounded-xl bg-red-500/10 text-red-500 border border-red-500/20 font-black uppercase text-[10px] tracking-widest hover:bg-red-500 hover:text-white transition-all duration-500">
                                Reject
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
