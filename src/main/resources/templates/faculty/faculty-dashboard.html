<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Faculty Command HUD - InnovateCampus')}"></head>
<body class="bg-hyper-deep text-slate-50 min-h-screen relative flex flex-col">
    
    <!-- Hyper-Space Background -->
    <div th:replace="~{fragments/layout :: background}"></div>

    <!-- Navbar -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="max-w-7xl mx-auto px-6 py-12 relative z-10 w-full animate-[fade-in_1s_ease-out]">
        
        <!-- Flash Messages -->
        <div th:if="${success}" class="glass border-hyper-cyan/50 bg-hyper-cyan/10 text-hyper-cyan p-6 rounded-3xl mb-12 flex justify-between items-center shadow-[0_0_30px_rgba(0,242,255,0.2)] animate-pulse">
            <span class="font-black uppercase tracking-widest" th:text="${success}"></span>
            <button onclick="this.parentElement.style.display='none'" class="text-hyper-cyan hover:scale-125 transition-transform">&times;</button>
        </div>
        <div th:if="${error}" class="glass border-red-500/50 bg-red-500/10 text-red-500 p-6 rounded-3xl mb-12 flex justify-between items-center shadow-[0_0_30px_rgba(239,68,68,0.2)]">
            <span class="font-black uppercase tracking-widest" th:text="${error}"></span>
            <button onclick="this.parentElement.style.display='none'" class="text-red-500 hover:scale-125 transition-transform">&times;</button>
        </div>

        <!-- Faculty Hero -->
        <div class="glass rounded-[3rem] p-12 mb-16 relative overflow-hidden group border-white/5 bg-black/40">
            <div class="absolute -top-32 -right-32 w-96 h-96 bg-hyper-pink rounded-full mix-blend-screen filter blur-[120px] opacity-10 group-hover:opacity-30 transition-opacity duration-1000"></div>
            
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-center gap-12">
                <div>
                    <div class="flex items-center gap-4 mb-6">
                        <span class="px-4 py-1.5 rounded-full bg-hyper-pink/10 text-hyper-pink text-[10px] font-black uppercase tracking-[0.3em] border border-hyper-pink/30 shadow-[0_0_15px_rgba(255,0,242,0.2)]">
                            Authority Level: Faculty
                        </span>
                        <span class="w-2 h-2 rounded-full bg-hyper-pink animate-ping"></span>
                    </div>
                    
                    <h1 class="text-6xl md:text-7xl font-black text-hyper-title mb-6 tracking-tighter uppercase italic leading-none">
                        Faculty <br/>
                        <span class="animate-gradient">Command HUD.</span>
                    </h1>
                    
                    <p class="text-2xl text-hyper-text/60 font-light max-w-2xl leading-relaxed">
                        Authorize innovation protocols, manage sectoral team requests, and monitor the campus research trajectory.
                    </p>
                </div>

                <div class="grid grid-cols-2 gap-6 w-full md:w-auto">
                    <div class="glass p-8 rounded-3xl text-center border-hyper-text/5">
                        <div class="text-[10px] font-black text-hyper-text/50 uppercase tracking-widest mb-2">Pending Protocols</div>
                        <div class="text-5xl font-black text-hyper-cyan" th:text="${pendingCount}">0</div>
                    </div>
                    <div class="glass p-8 rounded-3xl text-center border-hyper-text/5">
                        <div class="text-[10px] font-black text-hyper-text/50 uppercase tracking-widest mb-2">Total Registry</div>
                        <div class="text-5xl font-black text-hyper-pink" th:text="${allProjects.size()}">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 max-w-4xl mx-auto gap-12">
            
            <!-- Pending Project Queue -->
            <div class="space-y-8">
                <div class="flex items-center justify-between px-2">
                    <h2 class="text-2xl font-black text-hyper-title uppercase italic tracking-tighter flex items-center gap-3">
                        <span class="w-2 h-8 bg-hyper-cyan rounded-full"></span>
                        Protocol Queue
                    </h2>
                    <a th:href="@{/faculty/projects}" class="text-[10px] font-black text-hyper-text/50 hover:text-hyper-cyan transition-all uppercase tracking-widest border-b border-transparent hover:border-hyper-cyan">View All Registry</a>
                </div>

                <div th:if="${pendingProjects.isEmpty()}" class="glass p-16 rounded-[3rem] text-center border-white/5 opacity-50">
                    <div class="text-5xl mb-6">🛰️</div>
                    <p class="uppercase font-black tracking-widest text-[10px]">No signals needing authorization</p>
                </div>

                <div th:each="project : ${pendingProjects}" class="glass rounded-[2.5rem] p-8 border-hyper-text/5 hover:border-hyper-cyan/30 transition-all duration-500 group">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="inline-block px-3 py-1 rounded-lg bg-hyper-text/5 text-hyper-text/50 text-[9px] font-black uppercase tracking-[0.2em] mb-3 border border-hyper-text/10" th:text="${project.domain}"></span>
                            <h3 class="text-2xl font-black text-hyper-title uppercase tracking-tight group-hover:text-hyper-cyan transition-colors" th:text="${project.title}"></h3>
                        </div>
                    </div>
                    <p class="text-hyper-text/60 text-sm font-light leading-relaxed line-clamp-2 mb-8" th:text="${project.description}"></p>
                    
                    <div class="flex gap-4">
                        <form th:action="@{/faculty/approve/{id}(id=${project.id})}" method="post" class="flex-1">
                            <button type="submit" class="w-full py-4 rounded-xl bg-hyper-cyan/10 text-hyper-cyan border border-hyper-cyan/20 font-black uppercase text-[10px] tracking-widest hover:bg-hyper-cyan hover:text-white transition-all duration-500 shadow-[0_0_15px_rgba(0,242,255,0.1)]">
                                Authorize
                            </button>
                        </form>
                        <form th:action="@{/faculty/reject/{id}(id=${project.id})}" method="post" class="flex-1">
                            <button type="submit" class="w-full py-4 rounded-xl bg-red-500/10 text-red-500 border border-red-500/20 font-black uppercase text-[10px] tracking-widest hover:bg-red-500 hover:text-white transition-all duration-500">
                                Abort
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
