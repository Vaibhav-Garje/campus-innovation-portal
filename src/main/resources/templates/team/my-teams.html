<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Teams - Campus Innovation Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold">🎓 Campus Innovation Portal</a>
    <div>
        <a th:href="@{/projects/list}" class="btn btn-outline-light btn-sm me-2">All Projects</a>
        <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <a th:href="@{/auth/logout}" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5">
    <h2>My Teams & Join Requests</h2>

    <div th:if="${myTeams.isEmpty()}" class="alert alert-info">
        You have not joined or created any team yet.
    </div>

    <div class="row" th:unless="${myTeams.isEmpty()}">
        <div class="col-md-6 mb-4" th:each="member : ${myTeams}">
            <div class="card">
                <div class="card-body">
                    <h5 th:text="${member.project.title}"></h5>
                    <p>Status: <span class="badge"
                                     th:classappend="${member.status == 'APPROVED'} ? 'bg-success' : 'bg-warning'"
                                     th:text="${member.status}"></span></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
