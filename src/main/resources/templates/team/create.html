<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Team - Campus Innovation Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold">🎓 Campus Innovation Portal</a>
    <div>
        <a th:href="@{/projects/list}" class="btn btn-outline-light btn-sm me-2">All Projects</a>
        <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
        <a th:href="@{/auth/logout}" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">👥 Create Team / Join as Team Member</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/team/create}" method="post">

                        <div class="mb-4">
                            <label class="form-label fw-bold">Select Project</label>
                            <select name="projectId" class="form-select" required>
                                <option value="">-- Choose a Project --</option>
                                <option th:each="project : ${projects}"
                                        th:value="${project.id}"
                                        th:text="${project.title} + ' (' + ${project.domain} + ')'">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Your Status in Team</label>
                            <input type="text" class="form-control bg-light"
                                   value="APPROVED (You are the creator)" readonly/>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100">
                            ✅ Create Team Membership
                        </button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/projects/list}" class="btn btn-secondary">← Back to All Projects</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
